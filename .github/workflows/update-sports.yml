name: Update Sports EPG

on:
  schedule:
    - cron: '0 5 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:

concurrency:
  group: sports-epg-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install epg2xml
        run: |
          python -m pip install --upgrade pip
          pip install "epg2xml[curl] @ git+https://github.com/epg2xml/epg2xml.git@v2.8.2"

      - name: Collect sports EPG
        run: |
          epg2xml run --config epg2xml_sports.json --channelfile Channel.json --xmlfile sports_update_tmp.xml

      - name: Validate, merge, and publish
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          import os
          import shutil
          import copy

          old_root = ET.parse("epg_sports.xml").getroot()
          new_root = ET.parse("sports_update_tmp.xml").getroot()

          old_channels = old_root.findall("channel")
          new_channels = new_root.findall("channel")
          new_programs = new_root.findall("programme")

          if len(old_channels) != 65:
              raise SystemExit("기존 채널 수 오류: 65개가 아닙니다.")

          if len(new_channels) != 18 or len(new_programs) < 200:
              raise SystemExit("신규 EPG 수집 검증 실패")

          old_ids = {c.get("id") for c in old_channels}
          new_ids = {c.get("id") for c in new_channels}

          if len(old_ids) != 65 or len(new_ids) != 18 or len(old_ids) != len(old_channels) or len(new_ids) != len(new_channels):
              raise SystemExit("중복 채널 ID 발견")

          overlap_ids = new_ids & old_ids
          added_ids = new_ids - old_ids

          if len(overlap_ids) != 18 or len(added_ids) != 0:
              raise SystemExit("기존 18개 채널 일치 여부 오류")

          new_counts = {}
          for p in new_programs:
              cid = p.get("channel")
              new_counts[cid] = new_counts.get(cid, 0) + 1

          for cid in new_ids:
              if new_counts.get(cid, 0) == 0:
                  raise SystemExit(f"신규 편성정보 없음: {cid}")

          merged_root = ET.Element(old_root.tag, old_root.attrib)

          inserted = False

          for child in old_root:
              if child.tag == "programme" and not inserted:
                  for c in new_channels:
                      if c.get("id") in added_ids:
                          merged_root.append(copy.deepcopy(c))
                  inserted = True

              if child.tag == "programme" and child.get("channel") in new_ids:
                  continue
              merged_root.append(copy.deepcopy(child))

          if not inserted:
              for c in new_channels:
                  if c.get("id") in added_ids:
                      merged_root.append(copy.deepcopy(c))

          for p in new_programs:
              merged_root.append(copy.deepcopy(p))

          merged_channels = merged_root.findall("channel")
          merged_programs = merged_root.findall("programme")

          if len(merged_channels) != 65:
              raise SystemExit("병합 후 채널 수 오류")

          counts = {}
          for p in merged_programs:
              cid = p.get("channel")
              counts[cid] = counts.get(cid, 0) + 1

          missing = [
              c.get("id") for c in merged_channels
              if counts.get(c.get("id"), 0) == 0
          ]

          if missing:
              raise SystemExit(f"편성정보 없는 채널: {missing}")

          ET.ElementTree(merged_root).write(
              "sports_update_merged.xml",
              encoding="utf-8",
              xml_declaration=True
          )

          ET.parse("sports_update_merged.xml")

          os.makedirs("backups", exist_ok=True)
          shutil.copy2(
              "epg_sports.xml",
              "backups/epg_sports_previous.xml"
          )

          os.replace("sports_update_merged.xml", "epg_sports.xml")

          print("병합 성공:", len(merged_channels), "채널,", len(merged_programs), "편성표")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg_sports.xml backups/epg_sports_previous.xml
          if git diff --cached --quiet; then
            echo "변경된 EPG 없음"
          else
            git commit -m "Update sports EPG"
            git push
          fi
